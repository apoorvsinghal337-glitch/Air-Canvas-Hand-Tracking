const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');let w,h,dpr,particles=[],start=performance.now(),raf;function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function seed(){particles=[];let count=Math.min(135,Math.floor(w*h/3100));for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push({x:w*.35+(Math.random()-.5)*w*.16,y:h*.48+(Math.random()-.5)*h*.1,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:Math.random()*1.9+.6,delay:Math.random()*650})}}function frame(now){let t=now-start;ctx.clearRect(0,0,w,h);if(t>950){let ox=w*(w>=700?.37:.35),oy=h*.48;for(const p of particles){let q=Math.max(0,(t-950-p.delay)/1000);if(q<=0)continue;let speed=q<1?q*q:1+(q-1)*.4;let x=p.x+p.vx*speed*47,y=p.y+p.vy*speed*47;let alpha=Math.max(0,Math.min(1,q*3))*(t>3450?Math.max(.1,1-(t-3450)/900):1);ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.r>1.6?'183,215,255':'130,145,255'},${alpha})`;ctx.shadowBlur=13;ctx.shadowColor='#8eafff';ctx.fill()}ctx.shadowBlur=0;if(t>1900&&t<3350){let glow=ctx.createRadialGradient(ox,oy,0,ox,oy,Math.min(w,h)*.5);glow.addColorStop(0,'rgba(148,164,255,.15)');glow.addColorStop(1,'rgba(148,164,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h)}}if(t<5600)raf=requestAnimationFrame(frame)}function replay(){const scene=document.getElementById('scene');scene.querySelectorAll('.photo,.core,.ring,.flash,.titleWrap,.actions').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});start=performance.now();seed();cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}addEventListener('resize',()=>{resize();seed()});resize();seed();raf=requestAnimationFrame(frame);
