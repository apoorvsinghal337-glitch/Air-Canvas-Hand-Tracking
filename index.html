
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Air Canvas Camera Test</title>
  <style>
    body {
      background: #101827;
      color: white;
      text-align: center;
      font-family: Arial;
      padding: 20px;
    }
    button {
      padding: 16px 30px;
      background: #00d4ff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
    }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>Air Canvas Camera Test</h1>
  <button onclick="startCamera()">
    Start Camera
  </button>
  <p id="status">Ready</p>
  <video id="video" autoplay playsinline muted></video>

  <script>
    async function startCamera() {
      const status = document.getElementById("status");

      status.innerText = "Starting camera...";

      try {
        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
          });

        const video = document.getElementById("video");
        video.srcObject = stream;
        await video.play();

        status.innerText = "Camera Working!";
      } catch (error) {
        status.innerText =
          "Error: " + error.name + " - " + error.message;
      }
    }
  </script>
</body>
</html>
