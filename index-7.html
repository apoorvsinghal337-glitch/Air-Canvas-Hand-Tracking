<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air Canvas AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf4ff;font-family:system-ui,Arial;text-align:center;padding:12px}h1{color:#54e7ff;margin:8px}p{color:#a9b8cf}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto}button{border:1px solid #516381;border-radius:10px;padding:11px 14px;background:#233553;color:white;font-size:15px}button:disabled{opacity:.5}#start{background:#00c9df;color:#00151a;font-weight:bold}.stage{position:relative;margin:auto;width:min(96vw,800px);aspect-ratio:4/3;background:#101a2d;border-radius:14px;overflow:hidden;border:1px solid #42516a}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}video{transform:scaleX(-1)}#paint{z-index:1}#pointer{z-index:2}#status{margin:12px auto;max-width:800px;color:#76edff;overflow-wrap:anywhere;min-height:42px}
</style>
</head>
<body>
<h1>✋ Air Canvas AI</h1><p>Index finger up = draw · Index + middle up = pause</p>
<div class="toolbar"><button id="start">📷 Start Camera</button><button data-color="#00e5ff">Cyan</button><button data-color="#ff478d">Pink</button><button data-color="#ffdb45">Yellow</button><button data-color="#ffffff">White</button><button id="eraser">Eraser</button><button id="clear">Clear</button><button id="save">Save PNG</button></div>
<div class="stage"><video id="video" playsinline autoplay muted></video><canvas id="paint" width="800" height="600"></canvas><canvas id="pointer" width="800" height="600"></canvas></div>
<div id="status" role="status">Ready. Tap Start Camera.</div>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('video'),paint=$('paint'),pointer=$('pointer'),ctx=paint.getContext('2d'),px=pointer.getContext('2d'),status=$('status'),start=$('start');
let color='#00e5ff',erasing=false,previous=null,tracker=null,started=false,latestTime=-1,stream=null;
function say(s){status.textContent=s}
function resetLine(){previous=null}
document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;erasing=false;resetLine();say('Color selected')}));
$('eraser').onclick=()=>{erasing=true;resetLine();say('Eraser selected')};
$('clear').onclick=()=>{ctx.clearRect(0,0,800,600);resetLine();say('Canvas cleared')};
$('save').onclick=()=>{const c=document.createElement('canvas');c.width=800;c.height=600;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,800,600);g.drawImage(paint,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='AirCanvas.png';a.click();say('Drawing saved')};
function loadScript(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.crossOrigin='anonymous';s.onload=resolve;s.onerror=()=>reject(new Error('Script unavailable: '+url));document.head.appendChild(s)})}
async function loadHands(){
 const urls=['https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js','https://unpkg.com/@mediapipe/hands@0.4/hands.js'];
 let last;
 for(const url of urls){try{say('Loading hand tracking library...');await loadScript(url);if(window.Hands)return window.Hands}catch(e){last=e}}
 throw last||new Error('Hand tracking library not loaded');
}
function raised(h,tip,pip){return h[tip].y<h[pip].y}
function handleResults(results){
 px.clearRect(0,0,800,600);
 const hand=results.multiHandLandmarks?.[0];
 if(!hand){resetLine();say('AI ready — show your hand');return}
 const x=(1-hand[8].x)*800,y=hand[8].y*600;
 px.beginPath();px.arc(x,y,10,0,Math.PI*2);px.fillStyle='#2aff9b';px.fill();
 const draw=raised(hand,8,6)&&!raised(hand,12,10);
 if(!draw){resetLine();say('Hand detected — paused');return}
 if(previous){
  const dist=Math.hypot(x-previous.x,y-previous.y);
  if(dist<110){ctx.save();ctx.globalCompositeOperation=erasing?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=erasing?34:6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(previous.x,previous.y);ctx.lineTo(x,y);ctx.stroke();ctx.restore()}
 }
 previous={x,y};say(erasing?'Erasing...':'Drawing...');
}
async function loop(){if(!started)return;try{if(video.readyState>=2&&video.currentTime!==latestTime){latestTime=video.currentTime;await tracker.send({image:video})}}catch(e){started=false;say('Tracking error: '+e.message);start.disabled=false;start.textContent='Retry Camera';return}requestAnimationFrame(loop)}
start.onclick=async()=>{
 if(started)return;
 start.disabled=true;
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera API unavailable. Use HTTPS in Chrome.');
  say('Opening camera...');
  if(!stream){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}})}
  video.srcObject=stream;await video.play();say('Camera working. Loading AI...');
  const Hands=window.Hands||await loadHands();
  tracker=new Hands({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/'+file});
  tracker.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:0.55,minTrackingConfidence:0.5});
  tracker.onResults(handleResults);
  started=true;latestTime=-1;start.textContent='Camera Running';say('AI ready — show your hand');requestAnimationFrame(loop);
 }catch(e){say('ERROR: '+(e?.message||String(e)));start.disabled=false;start.textContent='Retry Camera'}
};
</script>
</body></html>
