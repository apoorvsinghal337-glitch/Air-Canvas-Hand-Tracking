<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Canvas AI | Gallery</title><link rel="stylesheet" href="css/style.css"></head><body><main class="shell"><header class="top"><a class="brand" href="home.html">AIR CANVAS AI ✦</a><nav class="nav"><a href="home.html">Home</a><a href="studio.html">Studio</a></nav></header><section class="card"><h1>My Drawing Gallery</h1><p class="muted">Up to 8 drawings are saved locally in this browser. They do not upload to GitHub or any server. Clearing browser data may delete them.</p><div id="gallery" class="gallery"></div></section><p class="credit">Made by Apoorv Singhal</p></main><script>const root=document.getElementById('gallery');function render(){let data=[];try{data=JSON.parse(localStorage.getItem('aircanvas-gallery')||'[]')}catch(e){}root.replaceChildren();if(!data.length){root.textContent='No saved drawings yet. Open Studio and choose Save Gallery.';return}for(const item of data){const card=document.createElement('div');card.className='card art';const img=document.createElement('img');img.src=item.image;img.alt='Saved drawing';const date=document.createElement('p');date.className='small muted';date.textContent=item.date;const actions=document.createElement('div');actions.className='actions';const a=document.createElement('a');a.href=item.image;a.download='AirCanvas-'+item.id+'.jpg';const download=document.createElement('button');download.textContent='Download';a.appendChild(download);const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(!confirm('Delete this drawing?'))return;localStorage.setItem('aircanvas-gallery',JSON.stringify(data.filter(x=>x.id!==item.id)));render()};actions.append(a,del);card.append(img,date,actions);root.appendChild(card)}}render();</script></body></html>
